name: Озвучка голосом Артёма

# Озвучивает фразы из voice-phrases.js голосом Артёма (Voicer API) и коммитит mp3 в voices/.
# Запускается сам, когда меняется список фраз, или вручную: Actions → «Озвучка голосом Артёма» → Run workflow.
# Нужен секрет VOICER_API_KEY (без него шаг ничего не делает). Озвучиваются только новые и изменённые фразы.
on:
  push:
    branches: [main]
    paths:
      - voice-phrases.js
      - tools/gen_voices.py
      - .github/workflows/voices.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: voices
  cancel-in-progress: false

jobs:
  voices:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Зависимости
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Озвучка
        env:
          VOICER_API_KEY: ${{ secrets.VOICER_API_KEY }}
          VOICER_VOICE_ID: ${{ vars.VOICER_VOICE_ID }}
        run: python tools/gen_voices.py

      - name: Коммит
        run: |
          git config user.name "voice-bot"
          git config user.email "voice-bot@users.noreply.github.com"
          git add -A voices
          if git diff --cached --quiet; then echo "нечего коммитить"; exit 0; fi
          git commit -m "Озвучка: обновлены голосовые файлы"
          git pull --rebase origin main
          git push

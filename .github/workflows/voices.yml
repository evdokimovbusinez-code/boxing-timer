name: Озвучка нейроголосом

# Озвучивает фразы из voice-phrases.js и коммитит mp3 в voices/.
# Запускается сам, когда меняется список фраз, или вручную: Actions → «Озвучка нейроголосом» → Run workflow.
on:
  push:
    branches: [main]
    paths:
      - voice-phrases.js
      - tools/gen_voices.py
      - .github/workflows/voices.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: voices
  cancel-in-progress: false

jobs:
  voices:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Зависимости
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q piper-tts==1.8.0

      - name: Кэш моделей Piper
        uses: actions/cache@v4
        with:
          path: /tmp/piper-models
          key: piper-ru-medium-v1

      - name: Озвучка
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
        run: python tools/gen_voices.py

      - name: Коммит
        run: |
          git config user.name "voice-bot"
          git config user.email "voice-bot@users.noreply.github.com"
          git add voices
          if git diff --cached --quiet; then echo "нечего коммитить"; exit 0; fi
          git commit -m "Озвучка: обновлены голосовые файлы"
          git pull --rebase origin main
          git push

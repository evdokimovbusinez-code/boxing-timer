name: Звуки (кандидаты с Wikimedia Commons)

# Скачивает кандидатов в сигналы (гонг, колокол, свисток, горн, «палочки», тиканье) только со свободными лицензиями,
# обрабатывает ffmpeg и коммитит в sounds/cand/ той же ветки. Только вручную (Actions → Run workflow) на рабочей ветке:
# сигналы уже выбраны, а на push он сам залил кандидатов в main после слияния.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sounds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sounds:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - name: Скачать и обработать
        run: python3 tools/fetch_sounds.py
      - name: Закоммитить
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sounds
          git diff --cached --quiet && { echo "без изменений"; exit 0; }
          git commit -m "Звуки: кандидаты с Wikimedia Commons (свободные лицензии)"
          git push origin HEAD:${{ github.ref_name }}
